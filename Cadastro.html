<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro</title>

<link rel="stylesheet" href="Cadastro.css">

</head>

<body>

<header class="header">

<div class="logo">
Galeria Atemporal 
</div>

<div class="search">
<input
type="text"
placeholder="Digite para pesquisar"
>
<button>
<i class="fa-solid fa-magnifying-glass"></i>
</button>
</div>

<div class="header-actions">

<button class="icon-button">
<img class="img1"src ="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSGNNj-QvzULIPJhK02w5dlpCDmyslizZWAD6_LBjo1MF-dvbs4oZxPNbmy&s=10"/>
Notificações 
</button>

<button class="icon-button">
<i class="fa-solid fa-envelope"></i>
</button>

<button class="login-button">
<i class="fa-solid fa-user"></i>
Login/Cadastro
</button>

</div>

</header>

<nav class="nav-bar">

<button class="nav-input"></button>

<button class="nav-input"></button>

<div class="view-buttons">
<button>
<i class="fa-solid fa-grip"></i>
</button>

<button>
<i class="fa-solid fa-list"></i>
</button>
</div>

<button class="nav-input"></button>

</nav>
<main class="container">


<section class="profile">

<div class="photo-area">

<div class="photo">
<i class="fa-solid fa-camera"></i>
</div>

<button class="change-photo">
Trocar foto
</button>

</div>


<div class="profile-fields">

<div class="field">
<i class="fa-solid fa-user"></i>

<input
type="text"
placeholder="Nome da Pessoa"
>
</div>

<div class="field">
<i class="fa-solid fa-phone"></i>

<input
type="text"
placeholder="Telefone da pessoa"
>
</div>

<div class="field">
<i class="fa-solid fa-envelope"></i>

<input
type="email"
placeholder="E-mail"
>
</div>

<div class="field">
<i class="fa-solid fa-right-left"></i>

<div class="exchange-field">
<input
type="text"
placeholder="Numero de Trocas"
>

<span>12</span>
</div>
</div>

</div>

</section>

<div class="section-title">
<div></div>

<h2>
<i class="fa-solid fa-star"></i>
Coleções
</h2>

<div></div>
</div>

 <section class="collections">


<article class="card-1">

<div class="card-image">
<img
src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQjDpJPrsOiFrIcUZlOxA_7dPfLtVCe6BehFgunLHTedgq7KUPMQz40LKQw&s=10"
alt="Discos de Vinil"
>
</div>

<h3>Discos de Vinil</h3>

<p>12 Itens</p> 

<button>
Ver coleção
</button>

</article>
<article class="card-2">

<div class="card-image">
<img
src="https://recreio.com.br/wp-content/uploads/legacy/2021/03/08/dia-internacional-da-mulher-1228098.png"
alt="Livros"
>
</div>

<h3>Livros</h3>

<p>20 itens</p> 

<button>
Ver coleção
</button>

</article>

 <article class="card-3">

<div class="card-image">
<img
src="https://images.unsplash.com/photo-1613771404721-1f92d799e49f?auto=format&fit=crop&w=600&q=80"
alt="Cartinhas"
>
</div>

<h3>Cartinhas</h3>

<p>36 itens</p>

<button>
Ver coleção
</button>

</article>

<article class="card-4">

<div class="card-image">
<img
src="https://ogimg.infoglobo.com.br/in/23001849-c2f-667/FT1086A/INFOCHPDPICT000041975439.jpg"
alt="Jogo"
>
</div>

<h3>Jogo</h3>

<p>9 itens</p>

<button>
Ver coleção
</button>

</article>

</section>

</main>


<footer>
© 2025 Nome do site. Todos os direitos reservados.
</footer>

</body>
</html>
